<g class="sb">
 <circle cx="348" cy="156" r="7" fill="#e3f3e8"/><text x="345" y="159" font-size="8" fill="#166534">✓</text>
 <text x="362" y="153" font-size="10" font-weight="bold" fill="#1f2a2e">分析条件を確定</text>
 <text x="362" y="164">直近3日間 × 全クール平均／媒体別</text>
 <circle cx="348" cy="184" r="7" fill="#e3f3e8"/><text x="345" y="187" font-size="8" fill="#166534">✓</text>
 <text x="362" y="181" font-size="10" font-weight="bold" fill="#1f2a2e">集計データを書き出し</text>
 <text x="362" y="192">7シート／18項目・グラフ4点</text>
 <circle cx="348" cy="212" r="7" fill="#e3f3e8"/><text x="345" y="215" font-size="8" fill="#166534">✓</text>
 <text x="362" y="209" font-size="10" font-weight="bold" fill="#1f2a2e">レポートを生成</text>
 <circle cx="348" cy="234" r="7" fill="#e3f3e8"/><text x="345" y="237" font-size="8" fill="#166534">✓</text>
 <text x="362" y="231" font-size="10" font-weight="bold" fill="#1f2a2e">指定の格納先へ保存</text>
 <circle cx="348" cy="256" r="7" fill="#e3f3e8"/><text x="345" y="259" font-size="8" fill="#166534">✓</text>
 <text x="362" y="253" font-size="10" font-weight="bold" fill="#1f2a2e">社内通知メールを送信</text>
</g>
<text class="dim" x="322" y="292">300ms + n×420ms で1行ずつ .in を付与（opacity 0→1／左から6px スライド）</text>

<path class="ar" d="M596 176 L622 176" marker-end="url(#a)"/>

<!-- STEP3 -->
<text class="hd" x="630" y="66">STEP 3　完了（#repStep3）</text>
<rect class="bx" x="630" y="74" width="256" height="206" rx="8"/>
<rect x="630" y="74" width="256" height="34" fill="#0f766e" rx="8"/><rect x="630" y="96" width="256" height="12" fill="#0f766e"/>
