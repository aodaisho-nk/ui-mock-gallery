<text class="sb" x="34" y="147" fill="#0f766e">期間：直近3日間／比較：全クール平均／軸：媒体別</text>
<g class="sb">
 <text x="26" y="180">形式</text><text x="26" y="206">格納先</text><text x="26" y="232">通知先</text>
</g>
<rect class="bx" x="76" y="168" width="192" height="18" rx="4"/><text class="sb" x="82" y="181">PDF ＋ スプレッドシート　▼</text>
<rect class="bx" x="76" y="194" width="192" height="18" rx="4"/><text class="sb" x="82" y="207">共有ドライブ ＞ 採用 ＞ … ▼</text>
<rect class="bx" x="76" y="220" width="192" height="18" rx="4"/><text class="sb" x="82" y="233">採用チーム（3名）　▼</text>
<rect class="bx" x="26" y="248" width="116" height="22" rx="5"/><text class="sb" x="62" y="263">キャンセル</text>
<rect x="152" y="248" width="116" height="22" rx="5" fill="#0f766e"/>
<text x="168" y="263" font-size="10.5" fill="#fff" font-weight="bold">作成して格納する</text>

<path class="ar" d="M288 176 L314 176" marker-end="url(#a)"/>

<!-- STEP2 -->
<text class="hd" x="322" y="66">STEP 2　進行（#repStep2）</text>
<rect class="bx" x="322" y="74" width="266" height="206" rx="8"/>
<rect x="322" y="74" width="266" height="34" fill="#0f766e" rx="8"/><rect x="322" y="96" width="266" height="12" fill="#0f766e"/>
