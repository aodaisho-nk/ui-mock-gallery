<rect x="648" y="123" width="18" height="20" fill="#b91c1c" rx="2"/><text x="651" y="137" font-size="7" fill="#fff" font-weight="bold">PDF</text>
<text class="sb" x="670" y="132">採用分析レポート…</text><text class="sb" x="670" y="142">1.8MB・12ページ</text>
