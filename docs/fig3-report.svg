<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif">
<style>
 .bx{fill:#fff;stroke:#d7dee0;stroke-width:1.3}
 .sb{font-size:10px;fill:#5c6b70}
 .lb{font-size:11px;fill:#1f2a2e}
 .hd{font-size:12px;font-weight:bold;fill:#0f766e}
 .dim{font-size:9.5px;fill:#8a98a0;font-family:monospace}
 .ar{stroke:#0f766e;stroke-width:1.6;fill:none}
</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
 <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/></marker></defs>
<rect width="900" height="470" fill="#f2f5f5"/>
<text x="14" y="24" font-size="14" font-weight="bold">図3　レポート抽出フロー（POP 1枚を3ステップで差し替える）</text>
<text class="dim" x="14" y="40">オーバーレイ .ov#ovRep ＋ .pop.wide（幅520px）。#repStep1 / #repStep2 / #repStep3 を hidden で出し分ける。</text>

<!-- STEP1 -->
<text class="hd" x="14" y="66">STEP 1　設定（#repStep1）</text>
<rect class="bx" x="14" y="74" width="266" height="206" rx="8"/>
<rect x="14" y="74" width="266" height="34" fill="#0f766e" rx="8"/><rect x="14" y="96" width="266" height="12" fill="#0f766e"/>
<text x="26" y="90" font-size="11.5" fill="#fff" font-weight="bold">📄 分析レポートを作成</text>
<text x="26" y="104" font-size="9" fill="#cfe3e0">この分析結果をレポートにして、指定の場所へ格納します</text>
