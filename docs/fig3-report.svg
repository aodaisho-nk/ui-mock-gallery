<rect x="216" y="384" width="180" height="3" fill="#0f766e"/>
<text x="216" y="400" font-size="11" font-weight="bold">直近3日間と全クール平均の比較</text>
<g fill="#eef2f3"><rect x="216" y="408" width="110" height="26"/><rect x="332" y="408" width="110" height="26"/>
