<rect x="642" y="154" width="232" height="20" rx="5" fill="#f4f7f7" stroke="#d7dee0"/>
<text class="sb" x="650" y="168">📁 格納先：共有ドライブ ＞ 採用 ＞ …</text>
<rect class="bx" x="642" y="180" width="232" height="60" rx="5"/>
<rect x="642" y="180" width="232" height="18" fill="#f4f7f7"/>
<text class="sb" x="650" y="193">✉️ 社内通知メール</text>
<text class="sb" x="866" y="193" text-anchor="end" fill="#166534" font-weight="bold">✅ 送信しました</text>
<text class="sb" x="650" y="211">宛先：採用チーム（3名）</text>
<text class="sb" x="650" y="224">件名：【採用分析】直近3日間と全クール平均の比較レポート</text>
<text class="sb" x="650" y="236">本文：格納先＋要点3行（自動生成）</text>
<rect class="bx" x="642" y="248" width="110" height="22" rx="5"/><text class="sb" x="684" y="263">閉じる</text>
<rect x="758" y="248" width="116" height="22" rx="5" fill="#0f766e"/>
<text x="776" y="263" font-size="10.5" fill="#fff" font-weight="bold">👁 レポートを開く</text>

<!-- viewer -->
<line x1="14" y1="308" x2="886" y2="308" stroke="#d7dee0"/>
<text class="hd" x="14" y="330">STEP 4　レポートビューア（#ovView ／ .pop.doc 幅840px）</text>
