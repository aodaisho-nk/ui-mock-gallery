<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>指示書の図版を JPEG に変換</title>
<style>
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;background:#f2f5f5;
  color:#1f2a2e;margin:0;padding:26px;line-height:1.8}
h1{font-size:19px;margin:0 0 4px}
p.sub{font-size:13px;color:#5c6b70;margin:0 0 18px}
.bar{background:#fff;border:1px solid #d7dee0;border-radius:8px;padding:14px 16px;margin-bottom:18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
button{font-family:inherit;font-size:13px;padding:9px 18px;border-radius:6px;cursor:pointer;
  border:1px solid #d7dee0;background:#fff}
button.pri{background:#0f766e;border-color:#0f766e;color:#fff;font-weight:bold}
label{font-size:12px;color:#5c6b70}
select{font-family:inherit;font-size:13px;padding:5px 8px;border:1px solid #d7dee0;border-radius:5px}
#st{font-size:12px;color:#166534;margin-left:auto}
.card{background:#fff;border:1px solid #d7dee0;border-radius:8px;padding:14px;margin-bottom:14px}
.card h2{font-size:13px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.card h2 span{font-size:11px;color:#5c6b70;font-weight:normal}
.card h2 button{margin-left:auto;padding:5px 12px;font-size:11.5px}
.card img{max-width:100%;border:1px solid #e7ecec;display:block}
.note{font-size:12px;color:#5c6b70}
</style>
</head>
<body>

<h1>指示書の図版を JPEG に変換</h1>
<p class="sub">このページを開くと自動で変換されます。［すべてダウンロード］を押すと fig1〜fig3 の JPEG が保存されます。</p>

<div class="bar">
  <label>倍率
    <select id="scale">
      <option value="1">1x（標準）</option>
      <option value="2" selected>2x（推奨・高精細）</option>
      <option value="3">3x（印刷用）</option>
    </select>
  </label>
  <label>画質
    <select id="q">
      <option value="0.92" selected>92%</option>
      <option value="1">100%</option>
      <option value="0.8">80%（軽量）</option>
    </select>
  </label>
  <button onclick="render()">再変換</button>
  <button class="pri" onclick="dlAll()">すべてダウンロード</button>
  <span id="st"></span>
</div>

<div id="out"></div>

<p class="note">※ ダウンロード先はブラウザの既定のダウンロードフォルダです。まとめて保存するときに「複数ファイルのダウンロードを許可しますか」と聞かれたら許可してください。</p>

<script>
/* 図版のSVGはこのファイル内に埋め込んであります（外部ファイルを読まないため、どこに置いても動きます） */
const FIGS=[
 {name:"fig1-layout",     title:"図1　ダッシュボード全体レイアウト"},
 {name:"fig2-freeword",   title:"図2　フリーワード分析の状態遷移"},
 {name:"fig3-report",     title:"図3　レポート抽出フロー"}
];
const results={};

function svgText(name){
  return document.getElementById("src-"+name).textContent.trim();
}
function render(){
  const scale=+document.getElementById("scale").value;
  const q=+document.getElementById("q").value;
  document.getElementById("out").innerHTML="";
  document.getElementById("st").textContent="変換中…";
  let done=0;
  FIGS.forEach(f=>{
    const svg=svgText(f.name);
    const m=svg.match(/viewBox="0 0 (\d+) (\d+)"/);
    const W=+m[1], H=+m[2];
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas");
      c.width=W*scale; c.height=H*scale;
      const g=c.getContext("2d");
      g.fillStyle="#ffffff"; g.fillRect(0,0,c.width,c.height);
      g.drawImage(img,0,0,c.width,c.height);
      const url=c.toDataURL("image/jpeg",q);
      results[f.name]=url;
      const kb=Math.round(url.length*0.75/1024);
      const card=document.createElement("div");
      card.className="card";
      card.innerHTML=`<h2>${f.title}<span>${c.width} × ${c.height} px ／ 約 ${kb} KB</span>
        <button onclick="dl('${f.name}')">この図をダウンロード</button></h2>`;
      const im=document.createElement("img"); im.src=url; card.appendChild(im);
      document.getElementById("out").appendChild(card);
      if(++done===FIGS.length) document.getElementById("st").textContent="✅ 変換が完了しました";
    };
    img.onerror=()=>{document.getElementById("st").textContent="変換に失敗しました";};
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  });
}
function dl(name){
  const a=document.createElement("a");
  a.href=results[name]; a.download=name+".jpg"; a.click();
}
function dlAll(){ FIGS.forEach((f,i)=>setTimeout(()=>dl(f.name),i*400)); }
window.addEventListener("load",render);
</script>
